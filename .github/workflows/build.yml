name: Build Smart Culling Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Fix Hidden Windows Characters (CRLF to LF)
        run: |
          sed -i 's/\r$//' gradlew
          sed -i 's/\r$//' gradle.properties
          sed -i 's/\r$//' settings.gradle

      - name: Grant Strict Linux Execute Permissions
        run: chmod +x gradlew

      - name: Force Clean Build Mod
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SmartCulling-Jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
            
