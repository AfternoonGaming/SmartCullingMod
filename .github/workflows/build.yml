name: Build Smart Culling Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Clean old build
        run: ./gradlew clean --quiet

      - name: Build Mod (Single Strong Attempt)
        run: |
          echo "🚀 Starting build..."
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log
          echo "✅ Build command finished (exit code: $?)"

      - name: Show Critical Errors (if any)
        if: always()
        run: |
          echo "🔍 Checking for errors..."
          grep -iE "error|exception|failed|could not" build.log | tail -n 50 || echo "No major errors found"

      - name: List Generated JARs
        if: always()
        run: |
          echo "📦 JAR files found:"
          find build -name "*.jar" -type f 2>/dev/null || echo "No JAR found"
          ls -la build/libs 2>/dev/null || echo "build/libs folder missing"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SmartCulling-Mod
          path: |
            build/libs/*-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-all.jar
          if-no-files-found: warn
