name: Build Smart Culling Mod

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Mod (remapJar)
        run: ./gradlew remapJar --stacktrace --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SmartCulling-Mod-26.x
          path: build/libs/*.jar
          if-no-files-found: warn
