name: Build Smart Culling Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Clean previous builds
        run: ./gradlew clean --quiet

      - name: Build with remapJar (Minecraft 26.x Fabric)
        run: |
          echo "🚀 Building for Minecraft 26.x using remapJar..."
          ./gradlew remapJar --stacktrace --no-daemon 2>&1 | tee build.log
          echo "✅ Build command completed (Exit code: $?)"

      - name: Show Build Errors
        if: always()
        run: |
          echo "🔍 ERROR CHECK:"
          grep -iE "error|exception|failed|could not|unable" build.log | tail -n 60 || echo "No critical errors found"

      - name: List Generated JARs
        if: always()
        run: |
          echo "📦 Checking for JAR files..."
          ls -la build/libs/ 2>/dev/null || echo "build/libs folder not found"
          echo ""
          find build -name "*.jar" -type f 2>/dev/null || echo "No JAR files generated"

      - name: Upload Smart Culling JAR
        uses: actions/upload-artifact@v4
        with:
          name: SmartCulling-Mod-26.x
          path: build/libs/*-remapped.jar
          if-no-files-found: warn
