name: Build Smart Culling Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ls -la gradlew

      - name: Gradle Version
        run: ./gradlew --version

      - name: Clean
        run: ./gradlew clean --quiet || true

      # === MAIN BUILD ATTEMPTS (Multiple Fallbacks) ===
      - name: Try Build (Normal)
        id: try1
        run: ./gradlew build --stacktrace --info 2>&1 | tee build.log
        continue-on-error: true

      - name: Try remapJar (Fabric/Quilt)
        if: steps.try1.outcome != 'success'
        id: try2
        run: ./gradlew remapJar --stacktrace 2>&1 | tee -a build.log
        continue-on-error: true

      - name: Try shadowJar (Common for mods)
        if: steps.try2.outcome != 'success'
        id: try3
        run: ./gradlew shadowJar --stacktrace 2>&1 | tee -a build.log
        continue-on-error: true

      # === DEBUG OUTPUT ===
      - name: Show Build Summary
        if: always()
        run: |
          echo "=== LAST 150 LINES OF BUILD LOG ==="
          tail -n 150 build.log || echo "No build.log found"
          
          echo -e "\n=== ERRORS FOUND ==="
          grep -iE "error|exception|failed|could
